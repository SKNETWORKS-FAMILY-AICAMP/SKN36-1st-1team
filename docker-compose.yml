services:
  mysql:
    image: mysql:8.0
    container_name: skn36-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - skn36_mysql_data:/var/lib/mysql

volumes:
  skn36_mysql_data:
